# Two jobs in one container.
#
# 1. The web server of every mta-sts.<domain>: it serves
#    /.well-known/mta-sts.txt from sts/<domain>.txt with a certificate of
#    the lab CA (RFC 8461 3.3).
# 2. The gate: the lab network is internal, so nothing in it has a port on
#    the host. This container is also on a second network and passes a few
#    ports on 127.0.0.1 of the host on to robinmail and the peers, for the
#    test harness.
worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
    access_log /dev/stdout;
    default_type text/plain;
    server {
        listen 443 ssl;
        server_name ~^mta-sts\.(?<domain>.+)$;
        ssl_certificate /lab/secrets/web.crt;
        ssl_certificate_key /lab/secrets/web.key;
        location = /.well-known/mta-sts.txt {
            alias /lab/sts/$domain.txt;
        }
        location / { return 404; }
    }
}

stream {
    # host port -> inside
    server { listen 8450; proxy_pass 10.77.25.10:443; }   # robinmail HTTPS (JMAP)
    server { listen 2540; proxy_pass 10.77.25.10:25; }    # robinmail SMTP
    server { listen 2541; proxy_pass 10.77.25.11:25; }    # Postfix
    server { listen 2542; proxy_pass 10.77.25.12:25; }    # Exim
    server { listen 2543; proxy_pass 10.77.25.13:25; }    # OpenSMTPD
}

# OpenSMTPD as a lab peer: opensmtpd.test with the local users alice and
# bob, and late.opensmtpd.test, where every recipient is accepted and the
# delivery then fails for good, so the sender gets a notification.

pki mx.opensmtpd.test cert "/etc/smtpd-tls.crt"
pki mx.opensmtpd.test key "/etc/smtpd-tls.key"

smtp max-message-size 1M

listen on eth0 port 25 tls pki mx.opensmtpd.test hostname mx.opensmtpd.test
listen on lo port 25 hostname mx.opensmtpd.test

table late { "@late.opensmtpd.test" = "alice" }

action "local" maildir
action "late" mda "sh -c 'cat >/dev/null; echo Unknown user in the late table; exit 67'" virtual <late>
# To other servers: TLS is required and the certificate is checked against
# the system's authorities, which include the lab CA.
action "out" relay tls helo mx.opensmtpd.test

match from any for domain "opensmtpd.test" action "local"
match from any for domain "late.opensmtpd.test" action "late"
match from local for any action "out"

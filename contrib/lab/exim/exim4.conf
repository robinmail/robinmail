# Exim as a lab peer: exim.test with the local users alice and bob, and
# late.exim.test, where every recipient is accepted and then bounced.

primary_hostname = mx.exim.test
qualify_domain = exim.test
domainlist local_domains = exim.test
domainlist late_domains = late.exim.test
hostlist relay_from_hosts = 127.0.0.1

acl_smtp_rcpt = acl_check_rcpt
acl_smtp_data = acl_check_data

daemon_smtp_ports = 25
disable_ipv6 = true
host_lookup = *
never_users = root
log_file_path = /var/log/exim4/%slog
log_selector = +smtp_protocol_error +smtp_syntax_error +tls_certificate_verified +received_recipients

tls_advertise_hosts = *
tls_certificate = /etc/exim4/tls.crt
tls_privatekey = /etc/exim4/tls.key
smtputf8_advertise_hosts = *
dsn_advertise_hosts = *

# 1 MiB over SMTP, 4 MiB for what local users hand in, so robinmail can be
# offered more than this server accepts.
message_size_limit = ${if def:sender_host_address {1M}{4M}}

# Local users may choose their envelope sender.
trusted_users = alice : bob
local_from_check = false

ignore_bounce_errors_after = 1h
timeout_frozen_after = 1h

begin acl

acl_check_rcpt:
  accept hosts = :
  accept hosts = +relay_from_hosts
  deny   message = relay not permitted
         domains = ! +local_domains : ! +late_domains
  accept domains = +late_domains
  require verify = recipient
  accept

acl_check_data:
  accept

begin routers

dnslookup:
  driver = dnslookup
  domains = ! +local_domains : ! +late_domains
  transport = remote_smtp
  ignore_target_hosts = 127.0.0.0/8
  no_more

late_fail:
  driver = redirect
  domains = +late_domains
  data = :fail: Unknown user in the late table
  allow_fail

# jörg, a local part outside ASCII (RFC 6531), is alice.
aliases:
  driver = redirect
  domains = +local_domains
  data = ${lookup{$local_part}lsearch{/etc/exim4/aliases}}

localuser:
  driver = accept
  domains = +local_domains
  check_local_user
  transport = maildir_home
  cannot_route_message = Unknown user

begin transports

# robin.test only over TLS with a certificate the lab CA signed.
remote_smtp:
  driver = smtp
  tls_verify_certificates = /etc/ssl/certs/ca-certificates.crt
  hosts_require_tls = mx.robin.test
  tls_verify_hosts = mx.robin.test
  tls_verify_cert_hostnames = *

maildir_home:
  driver = appendfile
  directory = $home/Maildir
  maildir_format
  create_directory
  delivery_date_add
  envelope_to_add
  return_path_add
  mode = 0600

begin retry

# Try again soon: the tests do not wait.
*   *   F,2h,5s

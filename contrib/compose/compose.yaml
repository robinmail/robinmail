# Development services for robinmail: rqlite for metadata. It listens on
# 127.0.0.1 only and keeps its data in the container, so "down" starts from
# nothing.
#
#   docker compose -f contrib/compose/compose.yaml up -d
#
# Tests:
#   ROBINMAIL_TEST_RQLITE=http://127.0.0.1:4001 go test ./...
name: robinmail

services:
  rqlite:
    image: rqlite/rqlite:10.7.1
    ports:
      - "127.0.0.1:4001:4001"

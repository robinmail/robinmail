# Development services for robinmail: rqlite for metadata, Rspamd for spam
# scanning and Mailpit to catch outgoing mail. All listen on 127.0.0.1 only
# and keep their data in the container, so "down" starts from nothing.
#
#   docker compose -f contrib/compose/compose.yaml up -d
#
# Tests:
#   ROBINMAIL_TEST_RQLITE=http://127.0.0.1:4001 \
#   ROBINMAIL_TEST_RSPAMD=http://127.0.0.1:11333 go test ./...
#
# Without the first variable the tests that need rqlite are skipped; without
# the second, or when Rspamd does not answer, the end-to-end test of "serve"
# in cmd/robinmail is.
#
# rqlite-b is a second, separate database: two robinmail servers that send
# each other mail cannot share one. The tests that need it want
#   ROBINMAIL_TEST_RQLITE_B=http://127.0.0.1:4003
# and contrib/dev/send-demo.sh uses it for its second instance.
#
# rqlite-dev (port 4005) belongs to the development instance of
# contrib/dev/seed.sh and to "make e2e", which runs on that instance.
# rqlite and rqlite-b belong to the Go tests (and send-demo.sh): they
# make domains and accounts with random names by the hundred and never
# remove them, and their servers' queue workers take any row they find,
# so nothing a person looks at lives there. To empty them:
#   docker compose -f contrib/compose/compose.yaml up -d --force-recreate rqlite rqlite-b
name: robinmail

services:
  rqlite:
    image: rqlite/rqlite:10.7.1
    ports:
      - "127.0.0.1:4001:4001"

  rqlite-b:
    image: rqlite/rqlite:10.7.1
    ports:
      - "127.0.0.1:4003:4001"

  rqlite-dev:
    image: rqlite/rqlite:10.7.1
    ports:
      - "127.0.0.1:4005:4001"

  # Mailpit takes every message the development instance sends to a domain
  # that is not its own (contrib/dev/robinmail.dev.json routes "*" to it)
  # and shows it on http://127.0.0.1:8025. It delivers nothing: mail that
  # reaches it stays in the container. No relay is configured, so it
  # cannot be made to release a message either.
  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "500"
      # Mailpit asks GitHub for its newest version otherwise.
      MP_DISABLE_VERSION_CHECK: "true"

  # Rspamd runs without Redis, so greylisting, rate limits and Bayes are off.
  # It does look up DNS blocklists, so a scan can take a few seconds.
  rspamd:
    image: rspamd/rspamd:4.3.0
    ports:
      - "127.0.0.1:11333:11333"
    volumes:
      - ../rspamd/local.d/milter_headers.conf:/etc/rspamd/local.d/milter_headers.conf:ro
      # DKIM signing of outgoing mail, with keys from rspamd/dkim (ignored
      # by git; "robinmail dns <domain> <key file>" makes one).
      - ../rspamd/local.d/dkim_signing.conf:/etc/rspamd/local.d/dkim_signing.conf:ro
      - ./rspamd/dkim:/var/lib/rspamd/dkim:ro
      # Development only: score headers also on mail from 127.0.0.1, and
      # test patterns for "add header" and "rewrite subject".
      - ./rspamd/override.d/milter_headers.conf:/etc/rspamd/override.d/milter_headers.conf:ro
      - ./rspamd/local.d/options.inc:/etc/rspamd/local.d/options.inc:ro

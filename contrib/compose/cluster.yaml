# A robinmail cluster on one machine, for the cluster tests: three robinmail
# nodes, each with its own volume for its database and blobs. They are the
# whole cluster: the database is replicated between them with Raft
# (internal/raftdb). Everything listens on 127.0.0.1 only. Start it with the
# script, which first makes the master key and a certificate:
#
#   contrib/compose/cluster.sh up        build, start, join, add a domain and users
#   make cluster-test                    up, the tests in internal/clustertest, down
#   contrib/compose/cluster.sh down      stop and remove containers and volumes
#
# Ports on the host, for node 1, 2 and 3:
#
#   SMTP             2531  2532  2533
#   HTTPS (webmail)  8441  8442  8443    https://mail.robinmail.test, self-signed
#
# Next to the cluster runs "the other side": robinmail-sink, one robinmail
# with a database of its own and the domain sink.test, for the test that
# sends mail out of the cluster and back. Its webmail is on 8444
# (https://mail.sink.test). Neither side asks DNS about the other: each has
# a route for the other's domain (outbound.routes), and the mail never
# leaves the compose network.
#
# The three robinmail nodes answer to the same hostname, as they would behind
# one DNS name. To open the webmail of node 1 in a browser:
#
#   curl -k --resolve mail.robinmail.test:8441:127.0.0.1 https://mail.robinmail.test:8441/
#
# Nodes reach each other on port 7443 inside the compose network: blobs and
# the database's Raft messages, over mutual TLS pinned to the members'
# certificates (internal/cluster). That port is not published. No port
# offers SQL: a command on a node reaches its own server over loopback.
#
# Rspamd is optional: "cluster.sh up rspamd" starts one and points the nodes
# at it. Without it mail is delivered unscanned, which is what the tests use.
name: robinmail-cluster

x-robinmail: &robinmail
  image: robinmail-cluster
  build:
    context: ../..
  restart: "no"
  stop_grace_period: 35s

services:
  robinmail-1:
    <<: *robinmail
    hostname: robinmail-1
    command: ["-config", "/etc/robinmail/n1.json", "serve"]
    volumes: ["./cluster:/etc/robinmail:ro", "data-1:/var/lib/robinmail"]
    ports: ["127.0.0.1:2531:25", "127.0.0.1:8441:443"]
    networks: [cluster]
  robinmail-2:
    <<: *robinmail
    hostname: robinmail-2
    command: ["-config", "/etc/robinmail/n2.json", "serve"]
    volumes: ["./cluster:/etc/robinmail:ro", "data-2:/var/lib/robinmail"]
    ports: ["127.0.0.1:2532:25", "127.0.0.1:8442:443"]
    networks: [cluster]
  robinmail-3:
    <<: *robinmail
    hostname: robinmail-3
    command: ["-config", "/etc/robinmail/n3.json", "serve"]
    volumes: ["./cluster:/etc/robinmail:ro", "data-3:/var/lib/robinmail"]
    ports: ["127.0.0.1:2533:25", "127.0.0.1:8443:443"]
    networks: [cluster]

  # The other side: a single node with a database of its own.
  robinmail-sink:
    <<: *robinmail
    hostname: robinmail-sink
    command: ["-config", "/etc/robinmail/sink.json", "serve"]
    volumes: ["./cluster:/etc/robinmail:ro", "data-sink:/var/lib/robinmail"]
    ports: ["127.0.0.1:8444:443"]
    networks: [cluster]

  rspamd:
    profiles: [rspamd]
    image: rspamd/rspamd:4.3.0
    volumes:
      - ../rspamd/local.d/milter_headers.conf:/etc/rspamd/local.d/milter_headers.conf:ro
      - ../rspamd/local.d/dkim_signing.conf:/etc/rspamd/local.d/dkim_signing.conf:ro
      - ./rspamd/dkim:/var/lib/rspamd/dkim:ro
      - ./rspamd/override.d/milter_headers.conf:/etc/rspamd/override.d/milter_headers.conf:ro
      - ./rspamd/local.d/options.inc:/etc/rspamd/local.d/options.inc:ro
    networks: [cluster]

volumes:
  data-1:
  data-2:
  data-3:
  data-sink:

networks:
  # What the nodes share: SMTP between the two sides; blobs and Raft
  # between the robinmail nodes of the cluster.
  cluster:

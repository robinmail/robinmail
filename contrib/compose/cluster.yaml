# A robinmail cluster on one machine, for the cluster tests: three rqlite
# nodes and three robinmail nodes, each robinmail node with its own blob
# volume. Everything listens on 127.0.0.1 only. Start it with the script,
# which first makes the master key and a certificate:
#
#   contrib/compose/cluster.sh up        build, start, add a domain and users
#   make cluster-test                    up, the tests in internal/clustertest, down
#   contrib/compose/cluster.sh down      stop and remove containers and volumes
#
# Ports on the host, for node 1, 2 and 3:
#
#   rqlite HTTP      4011  4012  4013
#   SMTP             2531  2532  2533
#   HTTPS (webmail)  8441  8442  8443    https://mail.robinmail.test, self-signed
#
# The three robinmail nodes answer to the same hostname, as they would behind
# one DNS name. To open the webmail of node 1 in a browser:
#
#   curl -k --resolve mail.robinmail.test:8441:127.0.0.1 https://mail.robinmail.test:8441/
#
# Each robinmail node lists all three rqlite nodes, its "own" first. Nodes
# reach each other on port 7443 inside the compose network (mutual TLS, see
# internal/cluster); that port is not published.
#
# Rspamd is optional: "cluster.sh up rspamd" starts one and points the nodes
# at it. Without it mail is delivered unscanned, which is what the tests use.
name: robinmail-cluster

x-rqlite: &rqlite
  image: rqlite/rqlite:10.7.1
  # Three voters that find each other by name. A node that restarts keeps its
  # data (the container's own disk) and rejoins by itself.
  command: ["-bootstrap-expect", "3", "-join", "rqlite-1:4002,rqlite-2:4002,rqlite-3:4002"]

x-robinmail: &robinmail
  image: robinmail-cluster
  build:
    context: ../..
  depends_on: [rqlite-1, rqlite-2, rqlite-3]
  restart: "no"
  stop_grace_period: 35s

services:
  rqlite-1:
    <<: *rqlite
    hostname: rqlite-1
    environment: {NODE_ID: "1"}
    ports: ["127.0.0.1:4011:4001"]
  rqlite-2:
    <<: *rqlite
    hostname: rqlite-2
    environment: {NODE_ID: "2"}
    ports: ["127.0.0.1:4012:4001"]
  rqlite-3:
    <<: *rqlite
    hostname: rqlite-3
    environment: {NODE_ID: "3"}
    ports: ["127.0.0.1:4013:4001"]

  robinmail-1:
    <<: *robinmail
    hostname: robinmail-1
    command: ["-config", "/etc/robinmail/n1.json", "serve"]
    volumes: ["./cluster:/etc/robinmail:ro", "blobs-1:/var/lib/robinmail"]
    ports: ["127.0.0.1:2531:25", "127.0.0.1:8441:443"]
  robinmail-2:
    <<: *robinmail
    hostname: robinmail-2
    command: ["-config", "/etc/robinmail/n2.json", "serve"]
    volumes: ["./cluster:/etc/robinmail:ro", "blobs-2:/var/lib/robinmail"]
    ports: ["127.0.0.1:2532:25", "127.0.0.1:8442:443"]
  robinmail-3:
    <<: *robinmail
    hostname: robinmail-3
    command: ["-config", "/etc/robinmail/n3.json", "serve"]
    volumes: ["./cluster:/etc/robinmail:ro", "blobs-3:/var/lib/robinmail"]
    ports: ["127.0.0.1:2533:25", "127.0.0.1:8443:443"]

  rspamd:
    profiles: [rspamd]
    image: rspamd/rspamd:4.3.0
    volumes:
      - ../rspamd/local.d/milter_headers.conf:/etc/rspamd/local.d/milter_headers.conf:ro
      - ../rspamd/local.d/dkim_signing.conf:/etc/rspamd/local.d/dkim_signing.conf:ro
      - ./rspamd/dkim:/var/lib/rspamd/dkim:ro
      - ./rspamd/override.d/milter_headers.conf:/etc/rspamd/override.d/milter_headers.conf:ro
      - ./rspamd/local.d/options.inc:/etc/rspamd/local.d/options.inc:ro

volumes:
  blobs-1:
  blobs-2:
  blobs-3:

# DKIM signing for mail that robinmail's users send. robinmail signs nothing
# itself: it has Rspamd scan every outgoing message with the user's address
# in the "User" header of the request, and Rspamd answers with the
# DKIM-Signature header to add (RFC 6376). Without a key for the sender's
# domain Rspamd adds none and the mail goes out unsigned.
#
# One key per domain, in /var/lib/rspamd/dkim/<domain>.robinmail.key,
# readable by the user Rspamd runs as and by nobody else. To make one and
# get the DNS records to publish (MX, SPF, DKIM, DMARC, MTA-STS):
#
#   robinmail dns example.org /var/lib/rspamd/dkim/example.org.robinmail.key
#   chown _rspamd /var/lib/rspamd/dkim/example.org.robinmail.key
#
# Run it again any time to print the records of the key that is there. The
# selector must stay "robinmail": that is where the command says the public
# key is. In a cluster every Rspamd needs the same key files.

enabled = true;

# Sign what an authenticated user sends, and nothing else: mail that
# arrives from other servers is checked, not signed.
sign_authenticated = true;
sign_local = false;
sign_inbound = false;

# The signing domain is the domain of the From header. robinmail has
# already made sure that this address belongs to the user (the account's
# own address, or that with a +tag), so the user name need not be compared
# again here.
use_domain = "header";
allow_username_mismatch = true;

selector = "robinmail";
path = "/var/lib/rspamd/dkim/$domain.$selector.key";

# The whole domain is the signing domain as written, not the part the
# public suffix list calls registrable: the key file and the DNS record are
# named after exactly the domain in the address.
use_esld = false;
